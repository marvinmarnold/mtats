# SPDX-License-Identifier: MIT
name: site
on:
  push:
    branches: [main]
    paths: ['site/**']
  # Re-sync Hosting from the bucket without a commit (recovery and rollback; spec runbook).
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Fetched and built before any GCP credential exists (npm install scripts never see one).
      - name: Fetch published data and build
        run: |
          BOOT=$(Scripts/site-data.sh site)
          if [[ "$BOOT" == bootstrap ]]; then export MTATS_SITE_BOOTSTRAP=1; fi
          cd site && npm ci && npm run build
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - working-directory: site
        run: npx firebase deploy --only hosting --project mtats-release --non-interactive
